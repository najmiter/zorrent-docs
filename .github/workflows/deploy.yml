name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build minified site
        run: |
          set -euo pipefail
          mkdir -p dist

          npx -y esbuild@0.24 main.js --minify --outfile=dist/main.js

          npx -y html-minifier-terser@7 index.html \
            --collapse-whitespace \
            --remove-comments \
            --minify-css true \
            --minify-js true \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            -o dist/index.html

          mkdir -p dist/privacy-policy
          npx -y html-minifier-terser@7 privacy-policy/index.html \
            --collapse-whitespace \
            --remove-comments \
            --minify-css true \
            --remove-redundant-attributes \
            --use-short-doctype \
            -o dist/privacy-policy/index.html

          cp robots.txt sitemap.xml dist/
          cp -r icons dist/
          echo "zorrent.knoctal.com" > dist/CNAME
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
